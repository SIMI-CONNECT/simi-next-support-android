# Simi Next Support — signed release APK build
#
# ============================================================
# REQUIRED GITHUB SECRETS (set on this fork repo):
#
#   SUPPORT_KEYSTORE_BASE64      base64 of the .jks keystore file
#                                (same keystore used by simi-next-android)
#   SUPPORT_KEYSTORE_PASSWORD    keystore store-password
#   SUPPORT_KEY_ALIAS            key alias inside the keystore
#   SUPPORT_KEY_PASSWORD         key password (often == SUPPORT_KEYSTORE_PASSWORD
#                                if the keystore is PKCS12)
#
#   SUPPORT_RS_PUB_KEY           RustDesk server ed25519 pubkey (base64)
#   SUPPORT_BACKEND_BASE_URL     Backend base URL (e.g. https://api.simiconnect.com)
#   SUPPORT_BACKEND_SUPPORT_PUBKEY  Backend curve25519 sealed-box pubkey (base64)
#
# See .github/RELEASE_SETUP.md for extraction instructions and
# the expected cert fingerprint that must match simi-next-android's.
#
# ============================================================
# ICON SOURCE TODO (required before first release build):
#
#   Drop a 512x512 PNG at:  branding/ic_launcher_source.png
#
#   The workflow uses ImageMagick to resize it into every mipmap-* DPI bucket.
#   Without this file the build will fail at the "Generate launcher icons" step.
#   Commit branding/ic_launcher_source.png to the fork repo before tagging a
#   release.
#
# ============================================================
# BUILD PATCH PARITY with manual-debug-build.yml:
#
#   All five patches from commit 54e71a7 are baked into the source tree — they
#   are NOT applied as workflow steps. Both this workflow and manual-debug-build
#   inherit them automatically from the checked-in files:
#     1. pubspec.yaml: extended_text 14 -> 13          [in source]
#     2. strings.xml:  drop dup app_name               [in source]
#     3. gradle.properties: heap 6g                    [in source]
#     4. mipmap-anydpi-v26/ ic_launcher*.xml removed   [in source]
#     5. MainService.kt: setDefaults()+ic_stat_logo fix [in source]
#   Icon PNGs are generated by this workflow (step "Generate launcher icons").
#   The debug workflow skips icon generation; that is intentional — debug APKs
#   use whatever PNGs were committed.
#
# ============================================================
# DO NOT MODIFY manual-debug-build.yml — this file is the only release path.
# Tool versions (Flutter, Rust, NDK, cargo-ndk) MUST stay identical to
# manual-debug-build.yml. Promote version bumps through that workflow first.

name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      rs_pub_key:
        description: "RustDesk server ed25519 pubkey (base64). Leave empty to use SUPPORT_RS_PUB_KEY secret."
        required: false
        type: string
        default: ""
      backend_base_url:
        description: "Backend base URL. Leave empty to use SUPPORT_BACKEND_BASE_URL secret."
        required: false
        type: string
        default: ""
      backend_support_pubkey:
        description: "Backend curve25519 sealed-box pubkey. Leave empty to use SUPPORT_BACKEND_SUPPORT_PUBKEY secret."
        required: false
        type: string
        default: ""
      dry_run:
        description: "Dry run — build and sign but do NOT upload to the GitHub Release."
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  build-and-sign:
    name: Build & sign Next Support APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      RENDEZVOUS_SERVER: help.simiconnect.com
      API_SERVER: ""

    steps:
      - name: Checkout fork (full history for tag describe)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # libs/hbb_common is a submodule pointing at rustdesk/hbb_common.
      # The fork is a flat tree (no .gitmodules), so clone explicitly at the
      # same SHA that upstream rustdesk/rustdesk@1.4.6 referenced.
      - name: Init submodule libs/hbb_common
        run: |
          HBB_COMMON_SHA="48c37de3e6c4e399af6f51ca20e8e3e1fd037976"
          git submodule update --init --recursive || true
          if [ ! -f libs/hbb_common/Cargo.toml ]; then
            rm -rf libs/hbb_common
            git clone https://github.com/rustdesk/hbb_common libs/hbb_common
            (cd libs/hbb_common && git checkout "$HBB_COMMON_SHA")
          fi

      # ------------------------------------------------------------------ #
      # Resolve build-config: workflow_dispatch inputs win over secrets.    #
      # ------------------------------------------------------------------ #
      - name: Resolve build-config inputs
        id: cfg
        shell: bash
        env:
          IN_RS_PUB_KEY: ${{ github.event.inputs.rs_pub_key }}
          IN_BACKEND_BASE_URL: ${{ github.event.inputs.backend_base_url }}
          IN_BACKEND_SUPPORT_PUBKEY: ${{ github.event.inputs.backend_support_pubkey }}
          SECRET_RS_PUB_KEY: ${{ secrets.SUPPORT_RS_PUB_KEY }}
          SECRET_BACKEND_BASE_URL: ${{ secrets.SUPPORT_BACKEND_BASE_URL }}
          SECRET_BACKEND_SUPPORT_PUBKEY: ${{ secrets.SUPPORT_BACKEND_SUPPORT_PUBKEY }}
        run: |
          set -euo pipefail
          rs_pub_key="${IN_RS_PUB_KEY:-${SECRET_RS_PUB_KEY:-}}"
          backend_base_url="${IN_BACKEND_BASE_URL:-${SECRET_BACKEND_BASE_URL:-}}"
          backend_support_pubkey="${IN_BACKEND_SUPPORT_PUBKEY:-${SECRET_BACKEND_SUPPORT_PUBKEY:-}}"
          if [ -z "$rs_pub_key" ] || [ -z "$backend_base_url" ] || [ -z "$backend_support_pubkey" ]; then
            echo "::error::Missing one of rs_pub_key / backend_base_url / backend_support_pubkey (neither input nor secret provided)."
            exit 1
          fi
          # Mask the values so they don't appear in build logs.
          echo "::add-mask::$rs_pub_key"
          echo "::add-mask::$backend_support_pubkey"
          {
            echo "rs_pub_key<<EOF"
            echo "$rs_pub_key"
            echo "EOF"
            echo "backend_base_url<<EOF"
            echo "$backend_base_url"
            echo "EOF"
            echo "backend_support_pubkey<<EOF"
            echo "$backend_support_pubkey"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------ #
      # Decode + validate keystore                                           #
      # ------------------------------------------------------------------ #
      - name: Decode release keystore
        id: keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SUPPORT_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::SUPPORT_KEYSTORE_BASE64 secret is empty or missing."
            exit 1
          fi
          ks_dir="${RUNNER_TEMP}/keystore"
          mkdir -p "$ks_dir"
          ks_path="${ks_dir}/simi-next-support.jks"
          printf '%s' "${KEYSTORE_BASE64}" | base64 -d > "$ks_path"
          if [ ! -s "$ks_path" ]; then
            echo "::error::Decoded keystore is empty — SUPPORT_KEYSTORE_BASE64 likely corrupted."
            exit 1
          fi
          chmod 600 "$ks_path"
          echo "path=$ks_path" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------ #
      # Tool-chain setup — versions MUST match manual-debug-build.yml       #
      # ------------------------------------------------------------------ #
      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Set up Rust 1.81.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.81.0"
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
          components: rustfmt

      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: simi-next-support-android

      - name: Set up Android NDK r27c
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Export NDK env
        shell: bash
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      - name: Cache cargo-ndk binary
        id: cache-cargo-ndk
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-3.5.4-${{ runner.os }}

      - name: Install cargo-ndk 3.5.4
        if: steps.cache-cargo-ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --version 3.5.4 --locked

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache pub (pubspec.lock)
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      # ------------------------------------------------------------------ #
      # System + native deps                                                 #
      # ------------------------------------------------------------------ #
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            nasm yasm cmake ninja-build pkg-config unzip curl zip \
            libc6-dev gcc-multilib imagemagick

      # vcpkg placed at /opt/artifacts/vcpkg to avoid triggering manifest mode.
      - name: Set up vcpkg (outside workspace)
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: "120deac3062162151622ca4860575a33844ba10b"

      - name: Cache vcpkg Android packages
        id: vcpkg-cache
        uses: actions/cache@v4
        with:
          path: |
            /opt/artifacts/vcpkg/installed-arm64-android
            /opt/artifacts/vcpkg/installed-x64-android
            /opt/artifacts/vcpkg/installed
          key: vcpkg-android-arm64-x64-${{ hashFiles('vcpkg.json') }}-120deac306-multitriplet-v1

      - name: Build vcpkg deps for Android (arm64 + x86_64)
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          VCPKG_ROOT: /opt/artifacts/vcpkg
          ANDROID_NDK: ${{ env.ANDROID_NDK_HOME }}
        run: |
          set -euo pipefail
          # vcpkg in manifest mode is single-triplet — installing a second
          # triplet into the same install root wipes the first. Install each
          # triplet into its own --x-install-root, then rsync both into the
          # legacy /opt/artifacts/vcpkg/installed/<triplet> path that the
          # downstream cargo/hwcodec build expects.
          /opt/artifacts/vcpkg/vcpkg install \
            --triplet=arm64-android \
            --x-install-root=/opt/artifacts/vcpkg/installed-arm64-android
          /opt/artifacts/vcpkg/vcpkg install \
            --triplet=x64-android \
            --x-install-root=/opt/artifacts/vcpkg/installed-x64-android
          mkdir -p /opt/artifacts/vcpkg/installed
          rsync -a /opt/artifacts/vcpkg/installed-arm64-android/ /opt/artifacts/vcpkg/installed/
          rsync -a /opt/artifacts/vcpkg/installed-x64-android/   /opt/artifacts/vcpkg/installed/

      - name: Ensure legacy vcpkg installed/ layout is present (cache-hit path)
        if: steps.vcpkg-cache.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          mkdir -p /opt/artifacts/vcpkg/installed
          if [ -d /opt/artifacts/vcpkg/installed-arm64-android ]; then
            rsync -a /opt/artifacts/vcpkg/installed-arm64-android/ /opt/artifacts/vcpkg/installed/
          fi
          if [ -d /opt/artifacts/vcpkg/installed-x64-android ]; then
            rsync -a /opt/artifacts/vcpkg/installed-x64-android/ /opt/artifacts/vcpkg/installed/
          fi

      - name: Export VCPKG_ROOT for Cargo builds
        run: echo "VCPKG_ROOT=/opt/artifacts/vcpkg" >> "$GITHUB_ENV"

      # ------------------------------------------------------------------ #
      # Icon generation (branding/ic_launcher_source.png -> mipmap-* PNGs) #
      # ------------------------------------------------------------------ #
      - name: Generate launcher icons from branding source
        shell: bash
        run: |
          set -euo pipefail
          src="branding/ic_launcher_source.png"
          if [ ! -f "$src" ]; then
            echo "::error::$src not found. Drop a 512x512 PNG at branding/ic_launcher_source.png and commit it before tagging a release. See .github/RELEASE_SETUP.md."
            exit 1
          fi
          res="flutter/android/app/src/main/res"
          # DPI buckets: name -> side-length in px
          declare -A dpis=(
            [mipmap-mdpi]=48
            [mipmap-hdpi]=72
            [mipmap-xhdpi]=96
            [mipmap-xxhdpi]=144
            [mipmap-xxxhdpi]=192
          )
          for bucket in "${!dpis[@]}"; do
            size="${dpis[$bucket]}"
            out="${res}/${bucket}/ic_launcher.png"
            mkdir -p "$(dirname "$out")"
            convert "$src" -resize "${size}x${size}" "$out"
            echo "Generated $out (${size}x${size})"
          done

      # ------------------------------------------------------------------ #
      # Flutter + Rust build                                                 #
      # ------------------------------------------------------------------ #
      - name: flutter pub get
        working-directory: flutter
        run: flutter pub get

      - name: Install flutter_rust_bridge_codegen
        run: |
          cargo install cargo-expand --version 1.0.95 --locked
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked

      - name: Run flutter_rust_bridge_codegen
        run: |
          set -euo pipefail
          flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h
          # Wrap the DUMMY CODE FOR BINDGEN block in cfg(any()) to prevent
          # link-time symbol collisions (same patch as manual-debug-build.yml).
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("src/bridge_generated.rs")
          src = p.read_text()
          start = src.find("// ----------- DUMMY CODE FOR BINDGEN ----------")
          end = src.find("// ---------------------------------------------", start) + len("// ---------------------------------------------")
          if start != -1 and end > start:
              block = src[start:end]
              wrapped = "    #[cfg(any())]\n    mod _dummy_for_bindgen {\n        #[allow(non_camel_case_types)]\n        pub type Dart_Handle = *mut std::ffi::c_void;\n" + block + "\n    }\n"
              p.write_text(src[:start] + wrapped + src[end:])
              print("patched DUMMY CODE FOR BINDGEN block")
          else:
              print("DUMMY block not found, skipping patch")
          PY

      - name: Build Rust libs (release) — arm64-v8a + x86_64
        shell: bash
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
          RENDEZVOUS_SERVER: ${{ env.RENDEZVOUS_SERVER }}
          RS_PUB_KEY: ${{ steps.cfg.outputs.rs_pub_key }}
          API_SERVER: ${{ env.API_SERVER }}
        run: |
          set -euo pipefail
          # armeabi-v7a excluded: libvpx ARMv7 NDK cross-compile is broken.
          # Matches the exclusion in manual-debug-build.yml.
          cargo ndk \
            -t arm64-v8a \
            -t x86_64 \
            -o flutter/android/app/src/main/jniLibs \
            build --release --features flutter,hwcodec

      # ------------------------------------------------------------------ #
      # Rename cargo-ndk output + bundle libc++_shared.so.                   #
      #                                                                      #
      # cargo-ndk names the output `liblibrustdesk.so` (Rust crate           #
      # `librustdesk` → cdylib name `librustdesk` → cargo-ndk prefixes with  #
      # `lib`, giving `liblibrustdesk.so`). Android's `System.loadLibrary    #
      # ("rustdesk")` looks for `librustdesk.so`. Without this rename, the   #
      # APK installs but crashes on launch with                               #
      #   UnsatisfiedLinkError: dlopen failed: library "librustdesk.so" not  #
      #   found                                                                #
      # which was the v0.1.0 (2026-05-07) symptom.                            #
      #                                                                      #
      # cargo-ndk also dynamically links libc++_shared.so but doesn't bundle  #
      # it — Android only ships libc++_shared on debug builds via Gradle's   #
      # default packaging. Pulling the NDK copy in here makes the release    #
      # APK self-contained.                                                   #
      #                                                                      #
      # Pattern lifted from .github/workflows/playground.yml (upstream).      #
      # ------------------------------------------------------------------ #
      - name: Rename librustdesk + bundle libc++_shared.so
        shell: bash
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          set -euo pipefail
          jni="flutter/android/app/src/main/jniLibs"
          # Map ABI → NDK sysroot triple for libc++_shared.so.
          declare -A triplet=(
            [arm64-v8a]=aarch64-linux-android
            [armeabi-v7a]=arm-linux-androideabi
            [x86_64]=x86_64-linux-android
            [x86]=i686-linux-android
          )
          for abi in arm64-v8a x86_64; do
            d="$jni/$abi"
            if [ ! -d "$d" ]; then
              echo "::error::expected jniLibs dir $d after cargo-ndk; was the build for $abi skipped?"
              exit 1
            fi
            if [ -f "$d/liblibrustdesk.so" ]; then
              mv -v "$d/liblibrustdesk.so" "$d/librustdesk.so"
            elif [ -f "$d/librustdesk.so" ]; then
              echo "$d/librustdesk.so already correctly named, skipping rename"
            else
              echo "::error::no liblibrustdesk.so or librustdesk.so in $d"
              ls -la "$d"
              exit 1
            fi
            cpp="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/${triplet[$abi]}/libc++_shared.so"
            if [ ! -f "$cpp" ]; then
              echo "::error::libc++_shared.so missing at $cpp"
              exit 1
            fi
            cp -v "$cpp" "$d/libc++_shared.so"
          done
          echo "--- final jniLibs layout ---"
          find "$jni" -type f -name '*.so' -exec ls -la {} \;

      # ------------------------------------------------------------------ #
      # Write key.properties for the build.gradle signing fallback          #
      #                                                                      #
      # `flutter build apk` does NOT forward args after `--` to Gradle as   #
      # project properties — it interprets the first one as a Dart entry-  #
      # point target file and fails with "Target file ... not found". So   #
      # we use the key.properties fallback path that build.gradle already  #
      # supports (see flutter/android/app/build.gradle: storeFile /        #
      # storePassword / keyAlias / keyPassword keys).                      #
      # ------------------------------------------------------------------ #
      - name: Write key.properties for signing
        shell: bash
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          STORE_PASSWORD: ${{ secrets.SUPPORT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SUPPORT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SUPPORT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cat > flutter/android/key.properties <<EOF
          storeFile=${KEYSTORE_PATH}
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF
          chmod 600 flutter/android/key.properties

      # ------------------------------------------------------------------ #
      # Write gradle.properties with the simi.* runtime config values.       #
      #                                                                      #
      # build.gradle.simi.kts reads these via `project.findProperty(...)`   #
      # and uses them for buildConfigField + resValue + dart-defines. The   #
      # previous flow only passed RS_PUB_KEY etc. as `--dart-define`,       #
      # which is Flutter/Dart-side only — the Gradle side defaulted to     #
      # `PLACEHOLDER_RS_PUB_KEY`, leading to a release APK whose            #
      # `R.string.simi_rs_pub_key` was literally `${simiRsPubKey}` and     #
      # whose `BuildConfig.RS_PUB_KEY` was the placeholder default.         #
      #                                                                      #
      # gradle.properties is gitignored at repo root (verify before         #
      # adding); we write it into flutter/android/ where the build script   #
      # already lives, and shred at job end via the workflow's natural      #
      # cleanup.                                                              #
      # ------------------------------------------------------------------ #
      - name: Write gradle.properties with simi.* config
        shell: bash
        env:
          RS_PUB_KEY: ${{ steps.cfg.outputs.rs_pub_key }}
          BACKEND_BASE_URL: ${{ steps.cfg.outputs.backend_base_url }}
          BACKEND_SUPPORT_PUBKEY: ${{ steps.cfg.outputs.backend_support_pubkey }}
        run: |
          set -euo pipefail
          # Append (don't clobber) so any Flutter-default gradle.properties
          # the framework wrote during `flutter pub get` is preserved.
          gp="flutter/android/gradle.properties"
          touch "$gp"
          {
            echo ""
            echo "# Written by .github/workflows/release.yml — do not commit."
            echo "simi.rendezvousServer=${RENDEZVOUS_SERVER}"
            echo "simi.rsPubKey=${RS_PUB_KEY}"
            echo "simi.apiServer=${API_SERVER}"
            echo "simi.backendBaseUrl=${BACKEND_BASE_URL}"
            echo "simi.backendSupportPubkey=${BACKEND_SUPPORT_PUBKEY}"
          } >> "$gp"
          chmod 600 "$gp"
          # Smoke check: confirm placeholder isn't present.
          if grep -qE 'simi\.rsPubKey=PLACEHOLDER' "$gp"; then
            echo "::error::rsPubKey wrote as placeholder; secret missing?"
            exit 1
          fi

      # ------------------------------------------------------------------ #
      # Signed APK build                                                     #
      # The signingConfigs.release block in app/build.gradle reads the      #
      # four signing values from flutter/android/key.properties (written   #
      # in the previous step).                                              #
      # ------------------------------------------------------------------ #
      - name: flutter build apk --release (signed)
        working-directory: flutter
        shell: bash
        env:
          RS_PUB_KEY: ${{ steps.cfg.outputs.rs_pub_key }}
          BACKEND_BASE_URL: ${{ steps.cfg.outputs.backend_base_url }}
          BACKEND_SUPPORT_PUBKEY: ${{ steps.cfg.outputs.backend_support_pubkey }}
        run: |
          set -euo pipefail
          flutter build apk --release \
            --dart-define=RENDEZVOUS_SERVER="${RENDEZVOUS_SERVER}" \
            --dart-define=RS_PUB_KEY="${RS_PUB_KEY}" \
            --dart-define=BACKEND_BASE_URL="${BACKEND_BASE_URL}" \
            --dart-define=BACKEND_SUPPORT_PUBKEY="${BACKEND_SUPPORT_PUBKEY}" \
            --dart-define=API_SERVER="${API_SERVER}" \
            --dart-define=APP_CHANNEL=release

      # ------------------------------------------------------------------ #
      # Locate + rename output APKs                                          #
      # ------------------------------------------------------------------ #
      - name: Locate and rename signed APKs
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          out_dir="flutter/build/app/outputs/flutter-apk"
          # Sanitize: branch names from workflow_dispatch can contain `/`
          # (e.g. `fix/foo`), which `cp` then mis-reads as a path separator
          # and fails with "No such file or directory". For tag pushes
          # (`v0.1.1` etc.) this is a no-op.
          tag="${GITHUB_REF_NAME:-dev}"
          tag="${tag//\//-}"

          # flutter build apk --release without --split-per-abi produces a
          # single fat APK at app-release.apk. Rename it to include the tag.
          fat_apk="${out_dir}/app-release.apk"
          if [ -f "$fat_apk" ]; then
            named="${out_dir}/simi-next-support-${tag}.apk"
            cp "$fat_apk" "$named"
            echo "apk_fat=$named" >> "$GITHUB_OUTPUT"
            echo "Found fat APK: $named"
          fi

          # If split APKs were produced, rename them too.
          arm64="${out_dir}/app-arm64-v8a-release.apk"
          x86_64="${out_dir}/app-x86_64-release.apk"
          if [ -f "$arm64" ]; then
            named_arm64="${out_dir}/simi-next-support-${tag}-arm64-v8a.apk"
            cp "$arm64" "$named_arm64"
            echo "apk_arm64=$named_arm64" >> "$GITHUB_OUTPUT"
            echo "Found arm64 APK: $named_arm64"
          fi
          if [ -f "$x86_64" ]; then
            named_x86="${out_dir}/simi-next-support-${tag}-x86_64.apk"
            cp "$x86_64" "$named_x86"
            echo "apk_x86_64=$named_x86" >> "$GITHUB_OUTPUT"
            echo "Found x86_64 APK: $named_x86"
          fi

          # Verify at least one APK was found.
          if [ -z "$(ls ${out_dir}/simi-next-support-*.apk 2>/dev/null)" ]; then
            echo "::error::No signed APKs found under $out_dir"
            exit 1
          fi

      # ------------------------------------------------------------------ #
      # Signature verification                                               #
      # ------------------------------------------------------------------ #
      - name: Verify APK signature (apksigner)
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$sdk" ]; then
            echo "::error::ANDROID_SDK_ROOT / ANDROID_HOME not set; cannot find apksigner."
            exit 1
          fi
          apksigner="$(find "$sdk/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner not found under $sdk/build-tools."
            exit 1
          fi
          # Verify all produced APKs.
          for apk in flutter/build/app/outputs/flutter-apk/simi-next-support-*.apk; do
            echo "--- Verifying: $apk ---"
            "$apksigner" verify --verbose --print-certs "$apk"
          done

      # ------------------------------------------------------------------ #
      # Upload as workflow artifact (manual / dry-run)                       #
      # ------------------------------------------------------------------ #
      - name: Upload APK as workflow artifact
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: simi-next-support-apk-${{ github.run_id }}
          path: flutter/build/app/outputs/flutter-apk/simi-next-support-*.apk
          if-no-files-found: error
          retention-days: 14

      # ------------------------------------------------------------------ #
      # Attach to GitHub Release (on release publish, not dry-run)          #
      # ------------------------------------------------------------------ #
      - name: Attach APKs to GitHub Release
        if: ${{ github.event_name == 'release' && github.event.inputs.dry_run != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: flutter/build/app/outputs/flutter-apk/simi-next-support-*.apk
          fail_on_unmatched_files: true
