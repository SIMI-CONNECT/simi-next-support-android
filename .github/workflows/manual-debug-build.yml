# Simi Next Support — manual debug build (no signing)
#
# Lets a tech verify that the bootstrap-fork.sh output still builds against
# the current pinned upstream tag without burning a release tag. Tool versions
# MUST stay identical to release.yml — promote bumps here first.

name: manual-debug-build

on:
  workflow_dispatch:
    inputs:
      rs_pub_key:
        description: "RustDesk server ed25519 pubkey (base64). Optional for debug — defaults to placeholder."
        required: false
        type: string
        default: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      backend_base_url:
        description: "Backend base URL"
        required: false
        type: string
        default: "https://example.invalid"
      backend_support_pubkey:
        description: "Backend curve25519 sealed-box pubkey (base64). Placeholder for debug."
        required: false
        type: string
        default: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="

concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  debug-build:
    name: Build unsigned debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      RENDEZVOUS_SERVER: help.simiconnect.com
      API_SERVER: ""

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # libs/hbb_common is a submodule pointing at rustdesk/hbb_common.
      # Because this repo was bootstrapped as a flat tree the gitlink SHA is
      # not recorded; clone it explicitly at the same commit the upstream
      # rustdesk/rustdesk@1.4.6 tag referenced.
      - name: Init submodule libs/hbb_common
        run: |
          git submodule update --init --recursive || true
          # Fallback: if the gitlink is missing, clone the public submodule directly.
          if [ ! -f libs/hbb_common/Cargo.toml ]; then
            rm -rf libs/hbb_common
            git clone --depth 1 https://github.com/rustdesk/hbb_common libs/hbb_common
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Keep these versions in lockstep with release.yml.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.81.0"
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: simi-next-support-android

      - id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Export NDK env
        shell: bash
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      - id: cache-cargo-ndk
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-3.5.4-${{ runner.os }}

      - name: Install cargo-ndk 3.5.4
        if: steps.cache-cargo-ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --version 3.5.4 --locked

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            nasm yasm cmake ninja-build pkg-config unzip curl zip \
            libc6-dev gcc-multilib

      # Install vcpkg and use the repo's vcpkg.json to build native deps
      # (opus, libvpx, aom, libyuv) for Android ABIs via the NDK toolchain.
      # We cache the vcpkg installed tree keyed by vcpkg.json + vcpkg commit.
      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "120deac3062162151622ca4860575a33844ba10b"

      - name: Cache vcpkg Android packages
        id: vcpkg-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_installed
          key: vcpkg-android-arm64-x64-${{ hashFiles('vcpkg.json') }}-120deac306

      - name: Build vcpkg deps for Android (arm64 + x86_64)
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          VCPKG_ROOT: ${{ env.VCPKG_ROOT }}
          VCPKG_DEFAULT_TRIPLET: arm64-android
        run: |
          set -euo pipefail
          VCPKG="${VCPKG_ROOT}/vcpkg"
          # arm64-android and x64-android are community triplets included in vcpkg.
          for triplet in arm64-android x64-android; do
            echo "==> Installing vcpkg packages for ${triplet}"
            "${VCPKG}" install \
              --triplet="${triplet}" \
              opus libvpx aom libyuv libjpeg-turbo 2>&1 | tail -15
          done

      - name: Export VCPKG_ROOT for Cargo builds
        run: echo "VCPKG_ROOT=${{ env.VCPKG_ROOT }}" >> "$GITHUB_ENV"

      - name: flutter pub get
        working-directory: flutter
        run: flutter pub get

      - name: Build Rust libs (debug)
        shell: bash
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: |
          set -euo pipefail
          # armeabi-v7a excluded until libvpx armv7 NDK cross-compile is fixed.
          cargo ndk \
            -t arm64-v8a \
            -t x86_64 \
            -o flutter/android/app/src/main/jniLibs \
            build

      - name: flutter build apk --debug
        working-directory: flutter
        shell: bash
        env:
          RS_PUB_KEY: ${{ github.event.inputs.rs_pub_key }}
          BACKEND_BASE_URL: ${{ github.event.inputs.backend_base_url }}
          BACKEND_SUPPORT_PUBKEY: ${{ github.event.inputs.backend_support_pubkey }}
        run: |
          set -euo pipefail
          flutter build apk --debug \
            --dart-define=RENDEZVOUS_SERVER="${RENDEZVOUS_SERVER}" \
            --dart-define=RS_PUB_KEY="${RS_PUB_KEY}" \
            --dart-define=BACKEND_BASE_URL="${BACKEND_BASE_URL}" \
            --dart-define=BACKEND_SUPPORT_PUBKEY="${BACKEND_SUPPORT_PUBKEY}" \
            --dart-define=API_SERVER="${API_SERVER}"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: simi-next-support-debug-apk-${{ github.run_id }}
          path: flutter/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
