# Simi Next Support — manual debug build (no signing)
#
# Lets a tech verify that the bootstrap-fork.sh output still builds against
# the current pinned upstream tag without burning a release tag. Tool versions
# MUST stay identical to release.yml — promote bumps here first.

name: manual-debug-build

on:
  workflow_dispatch:
    inputs:
      rs_pub_key:
        description: "RustDesk server ed25519 pubkey (base64). Optional for debug — defaults to placeholder."
        required: false
        type: string
        default: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      backend_base_url:
        description: "Backend base URL"
        required: false
        type: string
        default: "https://example.invalid"
      backend_support_pubkey:
        description: "Backend curve25519 sealed-box pubkey (base64). Placeholder for debug."
        required: false
        type: string
        default: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="

concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  debug-build:
    name: Build unsigned debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      RENDEZVOUS_SERVER: help.simiconnect.com
      API_SERVER: ""

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # libs/hbb_common is a submodule pointing at rustdesk/hbb_common.
      # Because this repo was bootstrapped as a flat tree the gitlink SHA is
      # not recorded; clone it explicitly at the same commit the upstream
      # rustdesk/rustdesk@1.4.6 tag referenced.
      - name: Init submodule libs/hbb_common
        run: |
          # hbb_common is a submodule of upstream rustdesk/rustdesk@1.4.6 pinned
          # at SHA 48c37de3e6c4e399af6f51ca20e8e3e1fd037976. The fork is flat
          # (no .gitmodules) so we clone at that exact SHA — HEAD has API drift
          # vs 1.4.6 (e.g. Config::get_permanent_password rename).
          HBB_COMMON_SHA="48c37de3e6c4e399af6f51ca20e8e3e1fd037976"
          git submodule update --init --recursive || true
          if [ ! -f libs/hbb_common/Cargo.toml ]; then
            rm -rf libs/hbb_common
            git clone https://github.com/rustdesk/hbb_common libs/hbb_common
            (cd libs/hbb_common && git checkout "$HBB_COMMON_SHA")
          fi

      # Patch libs/hbb_common/src/config.rs so RENDEZVOUS_SERVERS, RS_PUB_KEY,
      # and API_SERVER are baked in at compile time via option_env!().
      # This runs after the clone step so it survives a cache hit on hbb_common.
      - name: Patch hbb_common config.rs (bake server defaults via option_env)
        run: |
          python3 - <<'PY'
          import pathlib, sys, textwrap

          cfg = pathlib.Path("libs/hbb_common/src/config.rs")
          src = cfg.read_text()

          # Already patched? (idempotent)
          if 'option_env!("RENDEZVOUS_SERVER")' in src:
              print("config.rs already patched, skipping.")
              sys.exit(0)

          OLD = (
              'pub const RENDEZVOUS_SERVERS: &[&str] = &["rs-ny.rustdesk.com"];\n'
              'pub const RS_PUB_KEY: &str = "OeVuKk5nlHiXp+APNn0Y3pC1Iwpwn44JGqrQCsWqmBw=";'
          )
          if OLD not in src:
              print("ERROR: expected RENDEZVOUS_SERVERS block not found", file=sys.stderr)
              sys.exit(1)

          NEW = (
              '// Baked in at compile time; override via RENDEZVOUS_SERVER / RS_PUB_KEY /\n'
              '// API_SERVER env vars passed to cargo.  const match is used instead of\n'
              '// option_env!().unwrap_or() which is not yet a stable const fn.\n'
              'pub const RENDEZVOUS_SERVERS: &[&str] = &[match option_env!("RENDEZVOUS_SERVER") {\n'
              '    Some(v) => v,\n'
              '    None => "rs-ny.rustdesk.com",\n'
              '}];\n'
              'pub const RS_PUB_KEY: &str = match option_env!("RS_PUB_KEY") {\n'
              '    Some(v) => v,\n'
              '    None => "OeVuKk5nlHiXp+APNn0Y3pC1Iwpwn44JGqrQCsWqmBw=",\n'
              '};\n'
              'pub const API_SERVER: &str = match option_env!("API_SERVER") {\n'
              '    Some(v) => v,\n'
              '    None => "",\n'
              '};'
          )

          cfg.write_text(src.replace(OLD, NEW))
          print("config.rs patched successfully.")
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Keep these versions in lockstep with release.yml.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.81.0"
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: simi-next-support-android

      - id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Export NDK env
        shell: bash
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      - id: cache-cargo-ndk
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-3.5.4-${{ runner.os }}

      - name: Install cargo-ndk 3.5.4
        if: steps.cache-cargo-ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --version 3.5.4 --locked

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            nasm yasm cmake ninja-build pkg-config unzip curl zip \
            libc6-dev gcc-multilib

      # Install vcpkg outside the repo checkout to avoid triggering manifest mode.
      # Upstream RustDesk places vcpkg at /opt/artifacts/vcpkg; we do the same.
      - name: Set up vcpkg (outside workspace to avoid manifest mode)
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: "120deac3062162151622ca4860575a33844ba10b"

      - name: Cache vcpkg Android packages
        id: vcpkg-cache
        uses: actions/cache@v4
        with:
          path: |
            /opt/artifacts/vcpkg/installed-arm64-android
            /opt/artifacts/vcpkg/installed-x64-android
            /opt/artifacts/vcpkg/installed
          key: vcpkg-android-arm64-x64-${{ hashFiles('vcpkg.json') }}-120deac306-multitriplet-v1

      - name: Build vcpkg deps for Android (arm64 + x86_64)
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          VCPKG_ROOT: /opt/artifacts/vcpkg
          ANDROID_NDK: ${{ env.ANDROID_NDK_HOME }}
        run: |
          set -euo pipefail
          # vcpkg in manifest mode is single-triplet — installing a second
          # triplet into the same install root wipes the first. Install each
          # triplet into its own --x-install-root, then rsync both into the
          # legacy /opt/artifacts/vcpkg/installed/<triplet> path that the
          # downstream cargo/hwcodec build expects.
          /opt/artifacts/vcpkg/vcpkg install \
            --triplet=arm64-android \
            --x-install-root=/opt/artifacts/vcpkg/installed-arm64-android
          /opt/artifacts/vcpkg/vcpkg install \
            --triplet=x64-android \
            --x-install-root=/opt/artifacts/vcpkg/installed-x64-android
          mkdir -p /opt/artifacts/vcpkg/installed
          rsync -a /opt/artifacts/vcpkg/installed-arm64-android/ /opt/artifacts/vcpkg/installed/
          rsync -a /opt/artifacts/vcpkg/installed-x64-android/   /opt/artifacts/vcpkg/installed/

      - name: Ensure legacy vcpkg installed/ layout is present (cache-hit path)
        if: steps.vcpkg-cache.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          mkdir -p /opt/artifacts/vcpkg/installed
          if [ -d /opt/artifacts/vcpkg/installed-arm64-android ]; then
            rsync -a /opt/artifacts/vcpkg/installed-arm64-android/ /opt/artifacts/vcpkg/installed/
          fi
          if [ -d /opt/artifacts/vcpkg/installed-x64-android ]; then
            rsync -a /opt/artifacts/vcpkg/installed-x64-android/ /opt/artifacts/vcpkg/installed/
          fi

      - name: Export VCPKG_ROOT for Cargo builds
        run: echo "VCPKG_ROOT=/opt/artifacts/vcpkg" >> "$GITHUB_ENV"

      - name: flutter pub get
        working-directory: flutter
        run: flutter pub get

      # Generate flutter_rust_bridge bindings BEFORE cargo build — the rust src
      # imports `mod bridge_generated` which is generated by this codegen step.
      # Pinned to upstream's bridge.yml at rustdesk@1.4.6.
      - name: Install flutter_rust_bridge_codegen
        run: |
          cargo install cargo-expand --version 1.0.95 --locked
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked

      - name: Run flutter_rust_bridge_codegen
        run: |
          set -euo pipefail
          flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h
          # The generated bridge_generated.rs has a "DUMMY CODE FOR BINDGEN"
          # block at top level whose extern "C" symbols collide with
          # allo-isolate / flutter_rust_bridge crate symbols at link time.
          # Wrap it in cfg(any()) (always-false) so it's parsed by tooling
          # but never compiled.
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("src/bridge_generated.rs")
          src = p.read_text()
          start = src.find("// ----------- DUMMY CODE FOR BINDGEN ----------")
          end = src.find("// ---------------------------------------------", start) + len("// ---------------------------------------------")
          if start != -1 and end > start:
              block = src[start:end]
              wrapped = "    #[cfg(any())]\n    mod _dummy_for_bindgen {\n        #[allow(non_camel_case_types)]\n        pub type Dart_Handle = *mut std::ffi::c_void;\n" + block + "\n    }\n"
              p.write_text(src[:start] + wrapped + src[end:])
              print("patched DUMMY CODE FOR BINDGEN block")
          else:
              print("DUMMY block not found, skipping patch")
          PY

      - name: Build Rust libs (debug)
        shell: bash
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
          # Propagate fleet server config to cargo so option_env!() in
          # libs/hbb_common/src/config.rs bakes the values into the .so at
          # compile time.  RENDEZVOUS_SERVER and API_SERVER come from the
          # job-level env block; RS_PUB_KEY comes from the workflow input.
          RENDEZVOUS_SERVER: ${{ env.RENDEZVOUS_SERVER }}
          RS_PUB_KEY: ${{ github.event.inputs.rs_pub_key }}
          API_SERVER: ${{ env.API_SERVER }}
        run: |
          set -euo pipefail
          # armeabi-v7a excluded until libvpx armv7 NDK cross-compile is fixed.
          # --features flutter,hwcodec required: flutter wires in
          # flutter_rust_bridge; hwcodec enables scrap's hardware codec path.
          cargo ndk \
            -t arm64-v8a \
            -t x86_64 \
            -o flutter/android/app/src/main/jniLibs \
            build --features flutter,hwcodec

      # ------------------------------------------------------------------ #
      # Rename liblibrustdesk.so -> librustdesk.so and bundle libc++_shared #
      # (see release.yml for full rationale)                                #
      # ------------------------------------------------------------------ #
      - name: Rename rust lib + bundle libc++_shared.so
        shell: bash
        run: |
          set -euo pipefail
          NDK_LIB_BASE="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib"
          declare -A ABI_TO_NDK_TRIPLE=(
            [arm64-v8a]=aarch64-linux-android
            [armeabi-v7a]=arm-linux-androideabi
            [x86_64]=x86_64-linux-android
            [x86]=i686-linux-android
          )
          for abi_dir in flutter/android/app/src/main/jniLibs/*/; do
            abi="$(basename "$abi_dir")"
            if [[ -f "${abi_dir}liblibrustdesk.so" ]]; then
              mv "${abi_dir}liblibrustdesk.so" "${abi_dir}librustdesk.so"
              echo "renamed ${abi}/liblibrustdesk.so -> librustdesk.so"
            fi
            triple="${ABI_TO_NDK_TRIPLE[$abi]:-}"
            if [[ -n "$triple" && -f "${NDK_LIB_BASE}/${triple}/libc++_shared.so" ]]; then
              cp "${NDK_LIB_BASE}/${triple}/libc++_shared.so" "${abi_dir}"
              echo "bundled ${abi}/libc++_shared.so"
            else
              echo "WARN: libc++_shared.so not found for abi=${abi} triple=${triple}" >&2
            fi
          done
          ls -la flutter/android/app/src/main/jniLibs/*/

      - name: flutter build apk --debug
        working-directory: flutter
        shell: bash
        env:
          RS_PUB_KEY: ${{ github.event.inputs.rs_pub_key }}
          BACKEND_BASE_URL: ${{ github.event.inputs.backend_base_url }}
          BACKEND_SUPPORT_PUBKEY: ${{ github.event.inputs.backend_support_pubkey }}
        run: |
          set -euo pipefail
          flutter build apk --debug \
            --dart-define=RENDEZVOUS_SERVER="${RENDEZVOUS_SERVER}" \
            --dart-define=RS_PUB_KEY="${RS_PUB_KEY}" \
            --dart-define=BACKEND_BASE_URL="${BACKEND_BASE_URL}" \
            --dart-define=BACKEND_SUPPORT_PUBKEY="${BACKEND_SUPPORT_PUBKEY}" \
            --dart-define=API_SERVER="${API_SERVER}"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: simi-next-support-debug-apk-${{ github.run_id }}
          path: flutter/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
