# Simi Next Support — manual debug build (no signing)
#
# Lets a tech verify that the bootstrap-fork.sh output still builds against
# the current pinned upstream tag without burning a release tag. Tool versions
# MUST stay identical to release.yml — promote bumps here first.

name: manual-debug-build

on:
  workflow_dispatch:
    inputs:
      rs_pub_key:
        description: "RustDesk server ed25519 pubkey (base64). Optional for debug — defaults to placeholder."
        required: false
        type: string
        default: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      backend_base_url:
        description: "Backend base URL"
        required: false
        type: string
        default: "https://example.invalid"
      backend_support_pubkey:
        description: "Backend curve25519 sealed-box pubkey (base64). Placeholder for debug."
        required: false
        type: string
        default: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="

concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  debug-build:
    name: Build unsigned debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      RENDEZVOUS_SERVER: help.simiconnect.com
      API_SERVER: ""

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # libs/hbb_common is a submodule pointing at rustdesk/hbb_common.
      # Because this repo was bootstrapped as a flat tree the gitlink SHA is
      # not recorded; clone it explicitly at the same commit the upstream
      # rustdesk/rustdesk@1.4.6 tag referenced.
      - name: Init submodule libs/hbb_common
        run: |
          git submodule update --init --recursive || true
          # Fallback: if the gitlink is missing, clone the public submodule directly.
          if [ ! -f libs/hbb_common/Cargo.toml ]; then
            rm -rf libs/hbb_common
            git clone --depth 1 https://github.com/rustdesk/hbb_common libs/hbb_common
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Keep these versions in lockstep with release.yml.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.81.0"
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: simi-next-support-android

      - id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Export NDK env
        shell: bash
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      - id: cache-cargo-ndk
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-3.5.4-${{ runner.os }}

      - name: Install cargo-ndk 3.5.4
        if: steps.cache-cargo-ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --version 3.5.4 --locked

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nasm cmake ninja-build pkg-config unzip curl \
            libc6-dev gcc-multilib

      # magnum-opus needs opus headers for each Android ABI.
      # Build opus from source with the NDK toolchain and install into a
      # VCPKG-layout tree so build.rs finds it at $VCPKG_ROOT/installed/<triplet>/
      - name: Build opus for Android ABIs
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          set -euo pipefail
          OPUS_VERSION=1.5.2
          OPUS_PREFIX="${HOME}/opus-android"
          mkdir -p /tmp/opus-src
          # Try multiple mirrors; xiph.org is sometimes blocked on GH runners.
          for url in \
            "https://github.com/xiph/opus/releases/download/v${OPUS_VERSION}/opus-${OPUS_VERSION}.tar.gz" \
            "https://ftp.osuosl.org/pub/xiph/releases/opus/opus-${OPUS_VERSION}.tar.gz" \
            "https://downloads.xiph.org/releases/opus/opus-${OPUS_VERSION}.tar.gz"; do
            if curl -fsSL --max-time 60 "${url}" | tar -xz -C /tmp/opus-src --strip-components=1; then
              break
            fi
            echo "Mirror ${url} failed, trying next..."
            rm -rf /tmp/opus-src && mkdir -p /tmp/opus-src
          done
          [ -f /tmp/opus-src/CMakeLists.txt ] || { echo "All mirrors failed"; exit 1; }

          # Map cargo-ndk targets → NDK toolchain triple + abi name
          declare -A TARGET_MAP
          TARGET_MAP["aarch64-linux-android"]="aarch64-linux-android:arm64-v8a:arm64-android"
          TARGET_MAP["armv7-linux-androideabi"]="armv7a-linux-androideabi:armeabi-v7a:arm-neon-android"
          TARGET_MAP["x86_64-linux-android"]="x86_64-linux-android:x86_64:x64-android"

          NDK_TOOLCHAIN="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          MIN_SDK=21

          for cargo_target in "${!TARGET_MAP[@]}"; do
            IFS=: read -r ndk_triple abi vcpkg_triplet <<< "${TARGET_MAP[$cargo_target]}"
            echo "==> Building opus for ${cargo_target} (abi=${abi})"
            # VCPKG layout: $VCPKG_ROOT/installed/<triplet>/{include,lib}
            install_dir="${OPUS_PREFIX}/installed/${vcpkg_triplet}"
            mkdir -p "${install_dir}"
            pushd /tmp/opus-src >/dev/null
            CC="${NDK_TOOLCHAIN}/${ndk_triple}${MIN_SDK}-clang" \
            CFLAGS="-O2 -fPIC" \
            cmake -S . -B "build-${abi}" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX="${install_dir}" \
              -DCMAKE_SYSTEM_NAME=Android \
              -DCMAKE_SYSTEM_VERSION=${MIN_SDK} \
              -DCMAKE_ANDROID_ARCH_ABI="${abi}" \
              -DCMAKE_ANDROID_NDK="${ANDROID_NDK_HOME}" \
              -DCMAKE_C_COMPILER="${NDK_TOOLCHAIN}/${ndk_triple}${MIN_SDK}-clang" \
              -DBUILD_SHARED_LIBS=OFF \
              -DOPUS_BUILD_PROGRAMS=OFF \
              -DOPUS_BUILD_TESTING=OFF \
              -G Ninja >/dev/null 2>&1
            cmake --build "build-${abi}" --parallel 2 >/dev/null
            cmake --install "build-${abi}" >/dev/null
            popd >/dev/null
          done

          # Expose a VCPKG_ROOT-like layout so magnum-opus build.rs finds headers.
          # magnum-opus checks: $VCPKG_ROOT/installed/<vcpkg-triplet>/include/opus/
          export VCPKG_ROOT="${OPUS_PREFIX}"
          echo "VCPKG_ROOT=${VCPKG_ROOT}" >> "$GITHUB_ENV"

      # libs/scrap binds libvpx; build from source for each Android ABI.
      # Uses the same VCPKG_ROOT tree as the opus step above.
      - name: Build libvpx for Android ABIs
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          VCPKG_ROOT: ${{ env.VCPKG_ROOT }}
        run: |
          set -euo pipefail
          VPX_VERSION=1.15.0
          VPX_SRC=/tmp/vpx-src
          mkdir -p "${VPX_SRC}"
          curl -fsSL --max-time 120 \
            "https://github.com/webmproject/libvpx/archive/refs/tags/v${VPX_VERSION}.tar.gz" \
            | tar -xz -C "${VPX_SRC}" --strip-components=1

          NDK_TOOLCHAIN="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          NDK_SYSROOT="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          MIN_SDK=21

          # libvpx target names for Android (as expected by ./configure --target=)
          # arm64-v8a → arm64-android-gcc
          # armeabi-v7a → armv7-android-gcc
          # x86_64 → x86_64-android-gcc
          declare -A TARGET_MAP
          TARGET_MAP["aarch64-linux-android"]="aarch64-linux-android:arm64-v8a:arm64-android:arm64-android-gcc"
          TARGET_MAP["armv7-linux-androideabi"]="armv7a-linux-androideabi:armeabi-v7a:arm-neon-android:armv7-android-gcc"
          TARGET_MAP["x86_64-linux-android"]="x86_64-linux-android:x86_64:x64-android:x86_64-android-gcc"

          for cargo_target in "${!TARGET_MAP[@]}"; do
            IFS=: read -r ndk_triple abi vcpkg_triplet vpx_target <<< "${TARGET_MAP[$cargo_target]}"
            echo "==> Building libvpx for ${abi} (target=${vpx_target})"
            install_dir="${VCPKG_ROOT}/installed/${vcpkg_triplet}"
            mkdir -p "${install_dir}/lib" "${install_dir}/include"
            pushd "${VPX_SRC}" >/dev/null
            CC="${NDK_TOOLCHAIN}/${ndk_triple}${MIN_SDK}-clang" \
            CXX="${NDK_TOOLCHAIN}/${ndk_triple}${MIN_SDK}-clang++" \
            AR="${NDK_TOOLCHAIN}/llvm-ar" \
            STRIP="${NDK_TOOLCHAIN}/llvm-strip" \
            RANLIB="${NDK_TOOLCHAIN}/llvm-ranlib" \
            ./configure \
              --target="${vpx_target}" \
              --sdk-path="${ANDROID_NDK_HOME}" \
              --libc="${NDK_SYSROOT}" \
              --prefix="${install_dir}" \
              --disable-examples \
              --disable-tools \
              --disable-docs \
              --disable-unit-tests \
              --enable-static \
              --disable-shared \
              --enable-vp8 \
              --enable-vp9 \
              --enable-multithread \
              --disable-runtime-cpu-detect 2>&1 | tail -5
            make -j2 2>&1 | tail -3
            make install 2>&1 | tail -3
            popd >/dev/null
            make -C "${VPX_SRC}" clean >/dev/null 2>&1 || true
          done

      - name: flutter pub get
        working-directory: flutter
        run: flutter pub get

      - name: Build Rust libs (debug)
        shell: bash
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: |
          set -euo pipefail
          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -t x86_64 \
            -o flutter/android/app/src/main/jniLibs \
            build

      - name: flutter build apk --debug
        working-directory: flutter
        shell: bash
        env:
          RS_PUB_KEY: ${{ github.event.inputs.rs_pub_key }}
          BACKEND_BASE_URL: ${{ github.event.inputs.backend_base_url }}
          BACKEND_SUPPORT_PUBKEY: ${{ github.event.inputs.backend_support_pubkey }}
        run: |
          set -euo pipefail
          flutter build apk --debug \
            --dart-define=RENDEZVOUS_SERVER="${RENDEZVOUS_SERVER}" \
            --dart-define=RS_PUB_KEY="${RS_PUB_KEY}" \
            --dart-define=BACKEND_BASE_URL="${BACKEND_BASE_URL}" \
            --dart-define=BACKEND_SUPPORT_PUBKEY="${BACKEND_SUPPORT_PUBKEY}" \
            --dart-define=API_SERVER="${API_SERVER}"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: simi-next-support-debug-apk-${{ github.run_id }}
          path: flutter/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
